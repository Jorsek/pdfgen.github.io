<?xml version="1.0" encoding="UTF-8"?>
<!--
  DEFAULT COVER — starter template.

  This is what a newly started scenario should ship with (copy this file's
  content into your scenario's cover-page.html). It mirrors the same fields,
  in the same order, as the XSL-generated cover in xsl.xsl's front.cover
  template, so switching between the two produces the same visual result.
  All styling (size, color, weight, labels) comes from the .cover-* rules
  and --cover-*-label tokens in style.css; edit values here, not appearance.

  WANT THE SYSTEM-GENERATED COVER INSTEAD? (metadata pulled automatically
  from the ditamap/bookmap at build time, no manual edits per document)
  Delete everything below and leave only:
      <span/>
  xsl.xsl's front.cover template will generate the cover from document
  metadata instead of this file.
-->
<div class="cover-page-container">
    <div class="cover-page-content">
        <div class="cover-top-area">
            <div class="text-wrapper">

                <!-- TITLE — populated automatically. Do not edit. -->
                <div class="cover-title">{map.title}</div>

                <!-- SUBTITLE — always shown. Edit text, or remove this line to hide. -->
                <div class="cover-subtitle">Enter subtitle here</div>

            </div>
        </div>

        <div class="cover-meta-block">
            <!--
                METADATA FIELDS — active by default, matching xsl.xsl's front.cover.
                Edit each placeholder value below; each line is independent.
                Copyright is on the back cover, not here — see xsl.xsl back.cover.
            -->
            <div class="cover-meta-item cover-prodname">Product Name</div>
            <div class="cover-meta-item cover-version">1.0.0</div>
            <div class="cover-meta-item cover-platform">Platform</div>
            <div class="cover-meta-item cover-doc-revision">Rev. A</div>
            <div class="cover-meta-item cover-author">Author Name</div>
            <div class="cover-meta-item cover-created">2026-01-01</div>

            <!-- OPTIONAL FIELDS — off by default in xsl.xsl too; remove comment markers to enable -->
            <!-- <div class="cover-meta-item cover-partno">P/N 000-0000-X</div> -->
            <!-- <div class="cover-meta-item cover-audience">Audience</div> -->
            <!-- <div class="cover-meta-item cover-publisher">Publisher Name</div> -->
            <!-- <div class="cover-meta-item cover-revised">2026-06-01</div> -->
        </div>

        <div class="cover-logo"/>
    </div>
</div>
